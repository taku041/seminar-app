<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セミナー管理アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div id="app" class="container py-5" v-cloak>
        <h1 class="text-center fw-bold mb-5">セミナー管理アプリ-2027年</h1>

        <div class="row g-3 mb-5 align-items-center bg-white p-4 rounded shadow-sm">
            <div class="col-md-5 d-flex align-items-center">
                <label for="monthSelect" class="form-label text-nowrap mb-0 me-2 fw-bold">開催月を選択:</label>
                <select id="monthSelect" class="form-select w-auto me-3" v-model="selectedMonth">
                    <option value="">すべて</option>
                    <option v-for="m in 12" :key="m" :value="String(m).padStart(2, '0')">{{ m }}月</option>
                </select>
                <span class="badge bg-secondary fs-6 text-nowrap">
                    現在表示中: {{ selectedMonth ? parseInt(selectedMonth) + '月' : 'すべて' }}
                </span>
            </div>

            <div class="col-md-7">
                <form @submit.prevent="searchSeminars" class="d-flex align-items-center">
                    <div class="position-relative flex-grow-1 me-2">
                        <input type="text" class="form-control pe-5" placeholder="キーワードを入力（検索ボタンまたはEnter）" v-model="keyword">
                        <button type="button" class="btn-clear text-muted" v-if="keyword" @click="clearKeyword">&times;</button>
                    </div>
                    <button type="submit" class="btn btn-primary text-nowrap">検索</button>
                </form>
            </div>
        </div>

        <div v-if="displayedSeminars.length > 0">
            <transition-group name="fade" tag="div" class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col" v-for="seminar in displayedSeminars" :key="seminar.id">
                    <seminar-card :event="seminar" @show-detail="openModal"></seminar-card>
                </div>
            </transition-group>
        </div>
        
        <div v-else class="text-center py-5">
            <p class="text-muted fs-5">該当するセミナーが見つかりませんでした。</p>
        </div>

        <div class="text-center mt-5 mb-5" v-if="hasMore">
            <button type="button" class="btn btn-outline-primary btn-lg px-5 py-2" @click="loadMore">
                もっと見る（残り {{ remainingCount }} 件）
            </button>
        </div>

        <seminar-modal 
            :event="selectedEvent" 
            :is-open="isModalOpen" 
            @close="closeModal">
        </seminar-modal>
    </div>

    <script src="js/seminar.js"></script>
</body>
</html>
